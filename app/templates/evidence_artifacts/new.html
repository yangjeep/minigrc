{% extends "base.html" %}
{% block title %}New evidence artifact · minigrc{% endblock %}
{% block content %}
<p><a href="/evidence-artifacts">&larr; Evidence Artifacts</a></p>
<h1>New evidence artifact</h1>
<form method="post" action="/evidence-artifacts" enctype="multipart/form-data">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  <label>Title <input type="text" name="title" required></label>
  <label>Description <textarea name="description"></textarea></label>
  <label>File <input type="file" name="file" required></label>
  <button type="submit">Capture evidence</button>
</form>
{% endblock %}
